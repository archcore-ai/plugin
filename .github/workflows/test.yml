name: Plugin Tests

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install bats-core
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq bats
          else
            brew install bats-core
          fi

      - name: Install shellcheck
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y -qq shellcheck
          else
            brew install shellcheck
          fi

      - name: Check JSON configs
        run: make check-json

      - name: Check script permissions
        run: make check-perms

      - name: ShellCheck
        run: make lint

      - name: Run tests
        run: make test

      - name: Resolve the pinned CLI asset
        id: cli-asset
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset=archcore_linux_amd64.tar.gz; digest=01887576c10aa612851945775ca4d08751b940ba8b3ece3f2846103a90eda783 ;;
            Darwin-arm64) asset=archcore_darwin_arm64.tar.gz; digest=dd39e75a8c8ac71ee17de9bac4fed57df5bf12045519d256979865505b7bbe6f ;;
            Darwin-x86_64) asset=archcore_darwin_amd64.tar.gz; digest=33337ff375d52d9ae8e7be69d567655584452b05e1ec5095df4408c0bb3d6468 ;;
            *) echo "Unsupported runner platform" >&2; exit 1 ;;
          esac
          {
            echo "asset=$asset"
            echo "digest=$digest"
            echo "dir=$RUNNER_TEMP/archcore-cli-0.8.3"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the pinned CLI from cache
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.cli-asset.outputs.dir }}
          key: archcore-cli-0.8.3-${{ steps.cli-asset.outputs.digest }}

      - name: Install the pinned CLI for MCP integration tests
        if: steps.cli-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ASSET: ${{ steps.cli-asset.outputs.asset }}
          DIGEST: ${{ steps.cli-asset.outputs.digest }}
          CLI_DIR: ${{ steps.cli-asset.outputs.dir }}
        run: |
          mkdir -p "$CLI_DIR"
          cd "$CLI_DIR"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 5 \
            "https://github.com/archcore-ai/cli/releases/download/v0.8.3/$ASSET" -o "$ASSET"
          printf '%s  %s\n' "$DIGEST" "$ASSET" | shasum -a 256 --check
          tar -xzf "$ASSET" archcore
          rm -f "$ASSET"

      - name: Put the pinned CLI on PATH
        shell: bash
        run: echo "${{ steps.cli-asset.outputs.dir }}" >> "$GITHUB_PATH"

      - name: Real MCP integration tests
        run: make test-integration
